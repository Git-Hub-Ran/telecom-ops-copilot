name: Tests

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      # Compares the latest committed results against the previous run, with a
      # 1.5pp buffer for run-to-run variance. After each eval re-run, move the
      # second path to the new results file and the --baseline to the prior one.
      - name: Verify no eval regression
        run: python scripts/score_eval.py --baseline eval/results_20260818_1229.csv eval/results_20260819_1110.csv
