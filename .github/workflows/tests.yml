name: Tests

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      # Compares latest committed results against itself as a sanity check.
      # Update both paths to the new results file after each eval re-run to
      # make this a real regression gate.
      - name: Verify no eval regression
        run: python scripts/score_eval.py --baseline eval/results_20260818_1229.csv eval/results_20260818_1229.csv
